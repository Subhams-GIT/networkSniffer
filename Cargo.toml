[package]
name = "networkSniffer"
version = "0.1.0"
edition = "2024"

[dependencies]
network-interface = "2.0.3"
pcap = {version = "2", features = ["capture-stream"]}
inquire = "0.9.1"
inquire-derive = "0.9.0"
fmt = "0.1.0"
indicatif = "0.18.3"
ratatui = "0.29.0"
color-eyre = "0.6.5"
itertools = "0.14.0"
unicode-width = "0.2.0"
crossterm = "0.29.0"
pnet = "0.35.0"
libc = "0.2.180"
pcap-parser = "0.17.0"
pcap-file = "2.0.0"
etherparse = "0.19.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5.54", features = ["derive"] }
